
name: Buat APK VARQO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v4

      - name: Instal platform Android
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Siapkan Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Kompilasi APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: VARQO-APK-Android
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
